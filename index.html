<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Unlock ❤️</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d88,#ff8fb3);
font-family:Arial;
}

.box{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
width:320px;
}

input{
width:90%;
padding:12px;
font-size:18px;
margin:20px 0;
}

button{
padding:12px 30px;
font-size:18px;
cursor:pointer;
background:#ff4d88;
color:white;
border:none;
border-radius:30px;
}

</style>

</head>

<body>

<div class="box">

<h2>❤️ Just For You ❤️</h2>

<p>Enter Our Secret Password</p>

<input
id="password"
type="password"
placeholder="Password">

<br>

<button onclick="unlock()">
Unlock ❤️
</button>

</div>

<script src="lock.js"></script>

</body>
</html>
